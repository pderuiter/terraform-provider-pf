# SonarQube analysis for scan:sonarqube (ci-cd-toolkit). With this file the
# toolkit runs sonar-scanner as-is (adding sonar.projectVersion), so the
# settings it would otherwise pass are repeated here. It exists for the Go
# coverage: the toolkit does not pass coverage.out (from test:unit) to
# SonarQube, which made new code count as 0% covered.
sonar.projectKey=wbyc-infra-iac-terraform-terraform-provider-pf
sonar.qualitygate.wait=true

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/dist/**,**/.terraform/**,**/*.tfstate,**/*.tfplan,docs/**,examples/**,templates/**,tools/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
